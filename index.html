<meta charset="utf-8">
<title>Loadout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  /* LIGHT (default): blueprint on paper */
  --bg:#F3F6FC; --bg-2:#FFFFFF; --bg-3:#E9EEF7; --panel:rgba(243,246,252,.85);
  --surface:#FFFFFF; --surface-2:#EEF2FA; --surface-3:#E2E9F4;
  --line:#DDE4F0; --line-2:#C6D1E2;
  --text:#182131; --text-dim:#556074; --text-faint:#8A94A6;
  --accent:#2E6BE6; --accent-hi:#1E56C8; --accent-dim:rgba(46,107,230,.10);
  --verify:#0E9C7A; --verify-dim:rgba(14,156,122,.12); --verify-line:rgba(14,156,122,.32);
  --code-bg:#0F1626;
  --green:#1C8F4C; --amber:#B4771A; --rose:#E0578F;
  --brass:var(--accent); --brass-hi:var(--accent-hi); --brass-dim:var(--accent-dim);
  --teal:var(--verify); --teal-dim:var(--verify-dim); --teal-line:var(--verify-line);
  --radius:14px; --radius-sm:9px; --maxw:1220px;
  --shadow:0 1px 2px rgba(24,33,49,.05), 0 12px 30px rgba(24,33,49,.09);
  --font-display:"Archivo",system-ui,sans-serif;
  --font-body:"Hanken Grotesk",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#0F1119; --bg-2:#0B0D14; --bg-3:#0C0F17; --panel:rgba(15,17,25,.84);
  --surface:#181B24; --surface-2:#20242E; --surface-3:#272C38;
  --line:#2A2F3B; --line-2:#3A4150;
  --text:#E8ECF4; --text-dim:#9AA3B2; --text-faint:#6B7486;
  --accent:#4A82F0; --accent-hi:#6A98F5; --accent-dim:rgba(74,130,240,.16);
  --verify:#3DD6B0; --verify-dim:rgba(61,214,176,.14); --verify-line:rgba(61,214,176,.34);
  --code-bg:#0A0E18;
  --green:#69C77E; --amber:#E0A24E; --rose:#E56F9B;
  --shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 12px 34px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
a{color:inherit; text-decoration:none}
button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit}
form{margin:0}
img{max-width:100%; display:block}
h1,h2,h3,h4{margin:0; font-family:var(--font-display); font-weight:800; line-height:1.05; text-wrap:balance; letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:4px}
::selection{background:var(--brass); color:#fff}
.mono{font-family:var(--font-mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 26px}
.topbar{position:sticky; top:0; z-index:50; background:var(--panel); backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
.topbar-in{max-width:var(--maxw); margin:0 auto; padding:0 26px; height:64px; display:flex; align-items:center; gap:16px}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:900; font-size:20px; letter-spacing:-.02em}
.brand .mark{width:26px; height:26px; border-radius:7px; background:linear-gradient(145deg,var(--accent-hi),var(--accent)); display:grid; place-items:center; color:#fff; font-weight:900; font-size:15px; box-shadow:0 0 0 1px rgba(255,255,255,.1) inset}
.brand .tag{font-family:var(--font-mono); font-size:9px; color:var(--text-faint); border:1px solid var(--line-2); padding:1px 5px; border-radius:5px; letter-spacing:.06em; text-transform:uppercase; margin-left:2px}
.nav{display:flex; gap:4px; align-items:center}
.nav a{padding:8px 12px; border-radius:8px; color:var(--text-dim); font-weight:600; font-size:14px}
.nav a:hover{color:var(--text); background:var(--surface)}
.nav a.on{color:var(--text); background:var(--surface)}
.grow{flex:1}
.topsearch{flex:1; max-width:420px; position:relative}
.topsearch input{width:100%; height:38px; border-radius:9px; background:var(--bg-3); border:1px solid var(--line); color:var(--text); padding:0 12px 0 34px; font-family:var(--font-mono); font-size:13px}
.topsearch input::placeholder{color:var(--text-faint)}
.topsearch input:focus{border-color:var(--line-2); background:var(--bg-2)}
.topsearch .ic{position:absolute; left:11px; top:11px; color:var(--text-faint)}
.avatar-btn{width:36px; height:36px; border-radius:50%; overflow:hidden; border:1px solid var(--line-2); flex:none}

.pagepad{padding:34px 0 90px}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 15px; border-radius:9px; font-weight:600; font-size:13.5px; border:1px solid var(--line-2); background:var(--surface); color:var(--text); transition:.14s; white-space:nowrap}
.btn:hover{background:var(--surface-2); border-color:#48505f}
.btn.sm{height:32px; padding:0 12px; font-size:12.5px; border-radius:8px}
.btn.brass{background:linear-gradient(160deg,var(--brass-hi),var(--brass)); color:#fff; border-color:transparent; font-weight:800}
.btn.brass:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; border-color:var(--line-2)}
.btn.on{border-color:var(--teal-line); color:var(--teal); background:var(--teal-dim)}
.icon-btn{width:38px; height:38px; border-radius:9px; border:1px solid var(--line-2); background:var(--surface); display:grid; place-items:center; color:var(--text-dim); transition:.14s; flex:none}
.icon-btn:hover{color:var(--text); background:var(--surface-2)}
.icon-btn.faved{color:var(--rose); border-color:rgba(229,111,155,.4); background:rgba(229,111,155,.1)}

/* ---------- chips / meta ---------- */
.cat-chip{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px; font-weight:500; padding:3px 8px; border-radius:6px; border:1px solid var(--line-2); color:var(--text-dim); background:var(--bg-3); letter-spacing:.02em}
.cat-dot{width:7px; height:7px; border-radius:2px; flex:none}
.tier{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; letter-spacing:.02em}
.tier.verified{color:var(--teal); background:var(--teal-dim); border:1px solid var(--teal-line)}
.tier.tested{color:var(--amber); background:rgba(180,119,26,.12); border:1px solid rgba(180,119,26,.32)}
.tier.community{color:var(--text-dim); background:var(--surface-2); border:1px solid var(--line-2)}
.price-free{color:var(--green); font-weight:700; font-family:var(--font-mono); font-size:13px}
.price-pro{color:var(--brass-hi); font-weight:700; font-family:var(--font-mono); font-size:13px}
.muted{color:var(--text-dim)}
.faint{color:var(--text-faint)}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); font-weight:500}

/* ---------- skill card ---------- */
.grid{display:grid; gap:16px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(262px,1fr))}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; transition:.16s; display:flex; flex-direction:column; position:relative}
.card:hover{border-color:var(--line-2); transform:translateY(-2px); box-shadow:var(--shadow)}
.card-cover{position:relative; aspect-ratio:16/10; background:var(--code-bg); border-bottom:1px solid var(--line)}
.card-cover canvas{width:100%; height:100%; display:block}
.card-fav{position:absolute; top:9px; right:9px; width:30px; height:30px; border-radius:8px; background:rgba(10,11,14,.6); backdrop-filter:blur(6px); display:grid; place-items:center; color:#fff; border:1px solid rgba(255,255,255,.08); transition:.14s}
.card-fav:hover{background:rgba(10,11,14,.85)}
.card-fav.faved{color:var(--rose)}
.card-cover .cover-cat{position:absolute; left:9px; top:9px}
.card-body{padding:13px 14px 14px; display:flex; flex-direction:column; gap:8px; flex:1}
.card-name{font-family:var(--font-display); font-weight:800; font-size:16.5px; letter-spacing:-.01em; line-height:1.15}
.card-tagline{color:var(--text-dim); font-size:13px; line-height:1.4; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card-meta{display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); flex-wrap:wrap}
.card-foot{display:flex; align-items:center; justify-content:space-between; padding-top:9px; border-top:1px solid var(--line); margin-top:2px}
.by{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-dim); min-width:0}
.by img{width:19px; height:19px; border-radius:50%; flex:none}
.by .vf{color:var(--teal); flex:none}
.rebuild{font-family:var(--font-mono); font-size:11px; color:var(--text-faint)}
.rebuild b{color:var(--brass-hi); font-weight:600}

/* ---------- home ---------- */
.hero{padding:52px 0 30px; border-bottom:1px solid var(--line); position:relative; overflow:hidden}
.hero-grid-bg{position:absolute; inset:0; background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:44px 44px; opacity:.35; mask-image:radial-gradient(circle at 30% 0%,#000,transparent 72%)}
.hero-in{position:relative}
.hero h1{font-size:clamp(38px,6vw,68px); font-weight:900; letter-spacing:-.035em; line-height:.98; max-width:14ch}
.hero h1 em{font-style:normal; color:var(--brass-hi)}
.hero p.lede{margin:18px 0 26px; color:var(--text-dim); font-size:18px; max-width:56ch; line-height:1.5}
.asksearch{max-width:660px; position:relative}
.asksearch .field{display:flex; align-items:center; gap:10px; background:var(--bg-3); border:1px solid var(--line-2); border-radius:13px; padding:6px 6px 6px 16px; box-shadow:var(--shadow)}
.asksearch .field:focus-within{border-color:var(--brass)}
.asksearch input{flex:1; background:none; border:0; color:var(--text); font-family:var(--font-mono); font-size:15px; height:44px}
.asksearch input::placeholder{color:var(--text-faint)}
.ask-hint{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.ask-hint .q{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); border:1px dashed var(--line-2); padding:5px 10px; border-radius:20px; transition:.14s}
.ask-hint .q:hover{color:var(--text); border-color:var(--brass); border-style:solid}
.stats-row{display:flex; gap:30px; margin-top:34px; flex-wrap:wrap}
.stat b{font-family:var(--font-display); font-size:26px; font-weight:800; display:block; letter-spacing:-.02em}
.stat span{font-family:var(--font-mono); font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em}

.section{padding:38px 0 6px}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; gap:16px}
.section-head h2{font-size:21px; font-weight:800; letter-spacing:-.02em}
.section-head a{font-family:var(--font-mono); font-size:12px; color:var(--text-dim)}
.section-head a:hover{color:var(--brass-hi)}

.cat-strip{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
.cat-tile{display:flex; align-items:center; gap:12px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:11px; transition:.15s}
.cat-tile:hover{border-color:var(--line-2); background:var(--surface-2)}
.cat-glyph{width:40px; height:40px; border-radius:9px; display:grid; place-items:center; flex:none; font-family:var(--font-mono); font-weight:600; font-size:15px}
.cat-tile .nm{font-weight:700; font-size:14px}
.cat-tile .ct{font-family:var(--font-mono); font-size:11px; color:var(--text-faint)}

/* ---------- browse ---------- */
.browse{display:grid; grid-template-columns:236px 1fr; gap:28px; align-items:start}
.rail{position:sticky; top:82px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:6px}
.rail-group{padding:12px 12px 14px; border-bottom:1px solid var(--line)}
.rail-group:last-child{border-bottom:0}
.rail-group h4{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); font-weight:500; margin-bottom:11px}
.filt{display:flex; align-items:center; gap:9px; padding:5px 6px; border-radius:7px; cursor:pointer; font-size:13.5px; color:var(--text-dim); transition:.12s}
.filt:hover{background:var(--surface-2); color:var(--text)}
.filt.on{color:var(--text)}
.filt .box{width:15px; height:15px; border-radius:4px; border:1.5px solid var(--line-2); flex:none; display:grid; place-items:center; transition:.12s}
.filt.on .box{background:var(--brass); border-color:var(--brass); color:#fff}
.filt .ct{margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-faint)}
.filt .cat-dot{margin-right:1px}
.browse-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:14px; flex-wrap:wrap}
.browse-head .rescount{font-family:var(--font-mono); font-size:13px; color:var(--text-dim)}
.browse-head .rescount b{color:var(--text)}
.sortsel{height:34px; background:var(--surface); border:1px solid var(--line-2); border-radius:8px; color:var(--text); padding:0 10px; font-family:var(--font-mono); font-size:12.5px}
.activefilts{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11.5px; padding:4px 6px 4px 9px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line-2); color:var(--text-dim)}
.pill button{color:var(--text-faint); display:grid; place-items:center}
.pill button:hover{color:var(--text)}

/* ---------- skill detail ---------- */
.detail{display:grid; grid-template-columns:1fr 330px; gap:30px; align-items:start}
.dhead{display:flex; gap:20px; margin-bottom:22px}
.dcover{width:132px; height:132px; border-radius:13px; overflow:hidden; border:1px solid var(--line); flex:none; background:var(--bg-3)}
.dcover canvas{width:100%; height:100%}
.dhead h1{font-size:34px; font-weight:900; letter-spacing:-.025em; margin-bottom:8px}
.dhead .dtag{color:var(--text-dim); font-size:16px; max-width:60ch; line-height:1.45}
.dhead-meta{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px}
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:20px}
.tab{padding:11px 15px; font-weight:700; font-size:14px; color:var(--text-dim); border-bottom:2px solid transparent; margin-bottom:-1px; transition:.13s; display:flex; align-items:center; gap:7px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text); border-bottom-color:var(--brass)}
.tab .tnum{font-family:var(--font-mono); font-size:11px; color:var(--text-faint)}
.tab.on .tnum{color:var(--brass-hi)}
.prose{font-size:15px; line-height:1.7; color:var(--text); max-width:70ch}
.prose h3{font-family:var(--font-display); font-size:18px; margin:26px 0 10px}
.prose p{margin:0 0 14px}
.prose ul{margin:0 0 16px; padding-left:2px; list-style:none; display:flex; flex-direction:column; gap:8px}
.prose li{padding-left:24px; position:relative}
.prose li::before{content:"→"; position:absolute; left:0; color:var(--brass); font-family:var(--font-mono)}
.prose code{font-family:var(--font-mono); font-size:.86em; background:var(--surface-2); padding:2px 6px; border-radius:5px; color:var(--brass-hi)}

.codeblock{background:var(--code-bg); border:1px solid var(--line); border-radius:11px; overflow:hidden; margin:0 0 16px}
.codeblock-top{display:flex; align-items:center; justify-content:space-between; padding:8px 10px 8px 14px; border-bottom:1px solid rgba(255,255,255,.09); background:rgba(255,255,255,.03)}
.codeblock-top .fn{font-family:var(--font-mono); font-size:12px; color:#aeb8c8}
.codeblock pre{margin:0; padding:16px; overflow-x:auto; font-family:var(--font-mono); font-size:12.5px; line-height:1.65; color:#cdd3c8}
.codeblock pre .k{color:var(--rose)} .codeblock pre .s{color:var(--teal)} .codeblock pre .c{color:var(--text-faint)} .codeblock pre .y{color:var(--brass-hi)}
.copybtn{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.05); color:#aeb8c8; transition:.13s}
.copybtn:hover{color:var(--text); border-color:var(--brass); color:var(--brass-hi)}
.copybtn.done{color:var(--teal); border-color:var(--teal-line)}

.install-targets{display:flex; gap:7px; margin-bottom:14px; flex-wrap:wrap}
.target{padding:7px 13px; border-radius:8px; border:1px solid var(--line-2); font-weight:600; font-size:13px; color:var(--text-dim); display:flex; align-items:center; gap:7px; transition:.13s}
.target:hover{color:var(--text)}
.target.on{color:var(--text); background:var(--surface-2); border-color:#4a5060}
.target .logo{width:16px; height:16px; border-radius:4px; flex:none}

/* verification tab */
.vgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px}
.vcard{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:16px}
.vcard .lbl{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint)}
.vcard .big{font-family:var(--font-display); font-size:30px; font-weight:800; margin-top:6px; letter-spacing:-.02em}
.vcard .sub{font-size:12.5px; color:var(--text-dim); margin-top:3px}
.vcard.tealcard .big{color:var(--teal)}
.ladder{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.rung{display:flex; gap:13px; padding:14px 16px; border-bottom:1px solid var(--line); align-items:flex-start}
.rung:last-child{border-bottom:0}
.rung .dot{width:20px; height:20px; border-radius:50%; flex:none; display:grid; place-items:center; margin-top:1px; font-size:11px; font-weight:800}
.rung.pass .dot{background:var(--teal); color:#06231c}
.rung.cur .dot{background:var(--brass); color:#fff}
.rung.off .dot{background:var(--surface-3); color:var(--text-faint); border:1px solid var(--line-2)}
.rung .rt{font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px}
.rung .rd{color:var(--text-dim); font-size:13px; margin-top:2px; line-height:1.45}
.rung.off .rt,.rung.off .rd{color:var(--text-faint)}
.rung .rtag{font-family:var(--font-mono); font-size:10px; margin-left:auto; padding:2px 7px; border-radius:5px; text-transform:uppercase; letter-spacing:.05em}
.rung.cur .rtag{background:var(--brass-dim); color:var(--brass-hi)}

/* right rail buy box */
.buybox{background:var(--surface); border:1px solid var(--line-2); border-radius:var(--radius); overflow:hidden; position:sticky; top:82px}
.buybox-top{padding:18px}
.priceline{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px}
.priceline .p{font-family:var(--font-display); font-size:26px; font-weight:800}
.priceline .p.free{color:var(--green)}
.priceline .p.pro{color:var(--brass-hi)}
.buybox .lic{margin:14px 0}
.lic-opt{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-bottom:7px; cursor:pointer; transition:.12s}
.lic-opt:hover{border-color:var(--line-2)}
.lic-opt.on{border-color:var(--brass); background:var(--brass-dim)}
.lic-opt .radio{width:15px; height:15px; border-radius:50%; border:2px solid var(--line-2); flex:none}
.lic-opt.on .radio{border-color:var(--brass); box-shadow:inset 0 0 0 3px var(--brass)}
.lic-opt .nm{font-weight:600; font-size:13.5px}
.lic-opt .pr{margin-left:auto; font-family:var(--font-mono); font-size:12.5px; color:var(--text-dim)}
.buybox-foot{padding:14px 18px; border-top:1px solid var(--line); background:var(--bg-3); display:flex; flex-direction:column; gap:9px}
.kv{display:flex; align-items:center; justify-content:space-between; font-size:13px}
.kv .k{color:var(--text-faint); font-family:var(--font-mono); font-size:11.5px}
.kv .v{color:var(--text-dim); font-family:var(--font-mono); font-size:12px}
.kv .v.teal{color:var(--teal)}
.runtimes{display:flex; gap:6px}

function avatarURL(u){ const user=USERS[u]||{hue:210}; return genAvatar(user.hue, (USERS[u]?.name||u)); }
function genAvatar(hue,name){
  const init=(name||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  const c=document.createElement("canvas"); c.width=c.height=80; const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,80,80);
  g.addColorStop(0,`hsl(${hue},42%,42%)`); g.addColorStop(1,`hsl(${(hue+40)%360},38%,26%)`);
  x.fillStyle=g; x.fillRect(0,0,80,80);
  x.fillStyle="rgba(255,255,255,.92)"; x.font="700 30px Archivo, sans-serif"; x.textAlign="center"; x.textBaseline="middle";
  x.fillText(init,40,44);
  return c.toDataURL();
}
/* deterministic machined glyph per skill */
function drawGlyph(canvas, seedStr, hex){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=canvas.clientWidth||260, h=canvas.clientHeight||162;
  canvas.width=w*dpr; canvas.height=h*dpr; const x=canvas.getContext("2d"); x.scale(dpr,dpr);
  let s=0; for(let i=0;i<seedStr.length;i++) s=(s*31+seedStr.charCodeAt(i))>>>0;
  const rnd=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  x.fillStyle="#0F1626"; x.fillRect(0,0,w,h);
  // faint grid
  x.strokeStyle="rgba(255,255,255,.035)"; x.lineWidth=1;
  for(let gx=0;gx<w;gx+=16){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,h);x.stroke();}
  for(let gy=0;gy<h;gy+=16){x.beginPath();x.moveTo(0,gy);x.lineTo(w,gy);x.stroke();}
  // machined nodes + connections in category hue
  const N=5+Math.floor(rnd()*4); const pts=[];
  for(let i=0;i<N;i++){ pts.push({x:24+rnd()*(w-48), y:22+rnd()*(h-44)}); }
  x.strokeStyle=hex+"66"; x.lineWidth=1.4;
  for(let i=0;i<pts.length;i++){ const j=(i+1+Math.floor(rnd()*2))%pts.length;
    x.beginPath(); x.moveTo(pts[i].x,pts[i].y); x.lineTo(pts[j].x,pts[j].y); x.stroke(); }
  for(const p of pts){
    x.beginPath(); x.arc(p.x,p.y,3.2,0,7); x.fillStyle="#0F1626"; x.fill();
    x.strokeStyle=hex; x.lineWidth=1.6; x.stroke();
    x.beginPath(); x.arc(p.x,p.y,1.1,0,7); x.fillStyle=hex; x.fill();
  }
  // corner registration ticks
  x.strokeStyle=hex+"aa"; x.lineWidth=1.4;
  [[10,10,1,1],[w-10,10,-1,1],[10,h-10,1,-1],[w-10,h-10,-1,-1]].forEach(([cx,cy,dx,dy])=>{
    x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+8*dx,cy); x.moveTo(cx,cy); x.lineTo(cx,cy+8*dy); x.stroke();
  });
  // initials, engraved
  const init=seedStr.split("-").map(w2=>w2[0]).slice(0,3).join("").toUpperCase();
  x.fillStyle="rgba(255,255,255,.9)"; x.font="600 13px 'IBM Plex Mono', monospace"; x.textBaseline="alphabetic";
  x.fillText(init, 12, h-12);
}
function mountGlyphs(root){ (root||document).querySelectorAll("canvas[data-glyph]").forEach(c=>{
  drawGlyph(c, c.getAttribute("data-glyph"), c.getAttribute("data-hex")); }); }
/* faux-UI cover for a shipped prototype */
function drawMock(canvas, seedStr, hex){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=canvas.clientWidth||300, h=canvas.clientHeight||168;
  canvas.width=w*dpr; canvas.height=h*dpr; const x=canvas.getContext("2d"); x.scale(dpr,dpr);
  let s=0; for(let i=0;i<seedStr.length;i++) s=(s*31+seedStr.charCodeAt(i))>>>0;
  const rnd=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  x.fillStyle="#0F1626"; x.fillRect(0,0,w,h);
  const pad=14;
  x.fillStyle="rgba(255,255,255,.16)";
  for(let i=0;i<3;i++){ x.beginPath(); x.arc(pad+i*9, pad, 2.3, 0,7); x.fill(); }
  x.fillStyle=hex+"33"; x.fillRect(pad, pad+9, w-pad*2, 11);
  x.fillStyle=hex; x.fillRect(pad, pad+9, 32, 11);
  const top=pad+30, variant=Math.floor(rnd()*3);
  if(variant===0){
    x.strokeStyle="rgba(255,255,255,.12)"; x.lineWidth=1; x.strokeRect(pad, top, 44, h-top-pad);
    for(let i=0;i<4;i++){ x.fillStyle="rgba(255,255,255,.10)"; x.fillRect(pad+8, top+10+i*13, 28, 5); }
    const cx=pad+56;
    for(let i=0;i<3;i++){ x.strokeStyle="rgba(255,255,255,.10)"; x.strokeRect(cx, top+i*((h-top-pad)/3), w-cx-pad, (h-top-pad)/3-7); }
    x.fillStyle=hex+"55"; x.fillRect(cx+8, top+8, 38, 7);
  } else if(variant===1){
    const cols=3, rows=2, gw=(w-pad*2-16)/cols, gh=(h-top-pad-8)/rows;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ x.strokeStyle="rgba(255,255,255,.12)"; x.strokeRect(pad+c*(gw+8), top+r*(gh+8), gw, gh);
      x.fillStyle=(r+c)%2? hex+"44":"rgba(255,255,255,.08)"; x.fillRect(pad+c*(gw+8)+6, top+r*(gh+8)+6, gw*0.55, 6); }
  } else {
    x.strokeStyle="rgba(255,255,255,.10)"; x.strokeRect(pad, top, w-pad*2, h-top-pad);
    x.strokeStyle=hex; x.lineWidth=1.6; x.beginPath();
    const n=8; for(let i=0;i<n;i++){ const px=pad+12+i*((w-pad*2-24)/(n-1)); const py=top+8+(h-top-pad-16)*(0.55-0.4*Math.sin(i*0.9)+0.25*rnd()); if(i===0)x.moveTo(px,py); else x.lineTo(px,py);} x.stroke();
    for(let i=0;i<5;i++){ x.fillStyle=hex+"30"; const bh=(h-top-pad-16)*(0.25+0.5*rnd()); x.fillRect(pad+12+i*((w-pad*2-24)/5), h-pad-bh, 12, bh); }
  }
}
function mountMocks(root){ (root||document).querySelectorAll("canvas[data-mock]").forEach(c=>{
  drawMock(c, c.getAttribute("data-mock"), c.getAttribute("data-hex")); }); }

function toggleFilt(group,val){

function filteredSkills(){
  let r=SKILLS.slice();

  if(browseState.tiers.size) r=r.filter(s=>browseState.tiers.has(s.tier));
  if(browseState.price.size) r=r.filter(s=>(browseState.price.has("free")&&s.price===0)||(browseState.price.has("pro")&&s.price>0));
  if(browseState.rt.size) r=r.filter(s=>[...browseState.rt].some(rt=>s.rt.includes(rt)));
  if(browseState.q.trim()){ const q=browseState.q.toLowerCase();
    r=r.filter(s=>(s.name+" "+s.tag+" "+s.good.join(" ")+" "+CATS[s.cat].name+" "+s.ex.join(" ")).toLowerCase().includes(q)); }

  r.sort((a,b)=> sort==="tests"?b.tests-a.tests : sort==="favs"?b.favs-a.favs : sort==="new"?SKILLS.indexOf(b)-SKILLS.indexOf(a) : b.installs-a.installs);

    {k:"verified",t:"Verified",d:`Real source scanned, capability contract matches, agent-safety clean. ${sk.tests} tests pass and the exact bytes are held and hashed.`},
    {k:"deeply_verified",t:"Deeply verified",d:"Behavioral sandbox observation plus signed provenance. Currently unreachable, because we never mint a tier we can't yet prove."},
  ];
  const order=["unverified","basic","verified","deeply_verified"];
  const cur=order.indexOf(sk.tier);
  return `<div class="vgrid">
    <div class="vcard tealcard"><div class="lbl">Tests passing</div><div class="big tnum">${sk.tests}</div><div class="sub">every one mutation-checked</div></div>
    <div class="vcard"><div class="lbl">Rebuild cost</div><div class="big">${sk.rebuild}</div><div class="sub">est. tokens to build it yourself</div></div>
  </div>
  <div class="codeblock" style="margin-bottom:20px">
    <div class="codeblock-top"><span class="fn">held-artifact.sha256</span><span class="mono faint" style="font-size:11px">bytes we hold match what you install</span></div>
    <pre class="mono" style="color:var(--teal)">${genHash(sk.id)}</pre>
  </div>
  <div class="prose" style="margin-bottom:14px"><h3 style="margin-top:0">The verification ladder</h3><p>Each rung requires everything below it. Re-checked on every release. This skill sits at <b style="color:${sk.tier==='verified'?'var(--teal)':'var(--brass-hi)'}">${sk.tier}</b>.</p></div>
  <div class="ladder">
    ${rungs.map((r,i)=>{ const state=i<cur?'pass':i===cur?'cur':'off';
      return `<div class="rung ${state}"><span class="dot">${i<cur?'✓':i===cur?'●':'○'}</span>
        <div style="flex:1"><div class="rt">${esc(r.t)} ${state==='cur'?'<span class="rtag">this skill</span>':''}</div><div class="rd">${esc(r.d)}</div></div></div>`;
    }).join("")}
  </div>`;
}
function genHash(seed){ let s=0; for(let i=0;i<seed.length;i++)s=(s*33+seed.charCodeAt(i))>>>0;
  let h=""; const c="0123456789abcdef"; for(let i=0;i<64;i++){ s=(s*1664525+1013904223)>>>0; h+=c[s%16]; } return "sha256:"+h; }
function highlightMd(t){

    .replace(/^(---)$/gm,'<span class="c">$1</span>')
    .replace(/^(name|description|category|assurance|tests|runtimes):/gm,'<span class="k">$1</span>:')
    .replace(/^(#{1,3} .+)$/gm,'<span class="y">$1</span>')
    .replace(/&quot;([^&]+)&quot;/g,'<span class="s">&quot;$1&quot;</span>')
    .replace(/^(\s*-\s.+)$/gm,'<span class="s">$1</span>');
}

function router(){
  const hash=location.hash||"#/";
  const [path,qs]=hash.slice(1).split("?");
  const params=new URLSearchParams(qs||"");
  const parts=path.split("/").filter(Boolean);
  let html="";
  const key=parts[0]||"home";
  if(key==="home"||path==="/"||path===""){ html=viewHome(); setNav(""); }
  else if(key==="browse"){ html=viewBrowse(params); setNav("browse"); }
  else if(key==="skill"){ html=viewSkill(parts[1]); setNav(""); }
  else if(key==="list"){ html=viewList(parts[1]); setNav("profile"); }
  else if(key==="u"){ html=viewProfile(parts[1]); setNav(parts[1]==="mira"?"profile":""); }
  else if(key==="build"){ html=viewBuild(parts[1]); setNav("community"); }
  else if(key==="lists"){ html=viewLists(); setNav("lists"); }
  else if(key==="community"){ html=viewCommunity(); setNav("community"); }
  else { html=viewHome(); setNav(""); }
  $("#app").innerHTML=html;
  mountGlyphs(); mountAvatars(); mountMocks();
  if(key==="browse"){ renderBrowseGrid(); }
  window.scrollTo(0,0);
}
function setNav(k){ document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.nav===k)); }
window.addEventListener("hashchange",router);
window.addEventListener("resize",()=>{ clearTimeout(window._rz); window._rz=setTimeout(()=>{mountGlyphs();mountMocks();},150); });
function toggleTheme(){ const cur=document.documentElement.getAttribute('data-theme')||'light';
  const next=cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',next); store.save('theme',next); }
document.documentElement.setAttribute('data-theme', store.load('theme','light'));
const _mn=store.load('meName',null); if(_mn) USERS.mira.name=_mn;
router();
renderAuth();
</script>
